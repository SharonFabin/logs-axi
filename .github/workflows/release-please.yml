name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  id-token: write # npm trusted publishing (OIDC)

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify release commit
        if: ${{ steps.release.outputs.release_created }}
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          if [ "$RELEASE_SHA" != "$GITHUB_SHA" ]; then
            echo "::error::Release commit $RELEASE_SHA differs from workflow commit $GITHUB_SHA. See Releasing in README.md for recovery."
            exit 1
          fi

      - uses: actions/checkout@v4
        if: ${{ steps.release.outputs.release_created }}

      - uses: actions/setup-node@v6
        if: ${{ steps.release.outputs.release_created }}
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          cache: npm

      # Trusted publishing (OIDC) needs npm >= 11.5.1; pin one that has it so an
      # older cached Node 24 on the runner cannot fall back to an npm without it.
      - run: npm install -g npm@11.19.1
        if: ${{ steps.release.outputs.release_created }}

      - run: npm ci
        if: ${{ steps.release.outputs.release_created }}

      - run: npm test
        if: ${{ steps.release.outputs.release_created }}

      - run: npm run build
        if: ${{ steps.release.outputs.release_created }}

      - run: npm publish --access public --provenance
        if: ${{ steps.release.outputs.release_created }}
