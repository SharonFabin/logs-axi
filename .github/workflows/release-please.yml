name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  id-token: write # npm trusted publishing (OIDC); no NPM_TOKEN secret

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/checkout@v4
        if: ${{ steps.release.outputs.release_created }}

      - uses: actions/setup-node@v6
        if: ${{ steps.release.outputs.release_created }}
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          cache: npm

      # `npm stage` needs npm >= 11.18; pin one that has it so an older cached
      # Node 24 on the runner cannot fall back to an npm without it.
      - run: npm install -g npm@11.19.1
        if: ${{ steps.release.outputs.release_created }}

      - run: npm ci
        if: ${{ steps.release.outputs.release_created }}

      - run: npm test
        if: ${{ steps.release.outputs.release_created }}

      - run: npm run build
        if: ${{ steps.release.outputs.release_created }}

      # Staged, not published: the trusted publisher only allows `npm stage publish`,
      # so the version goes live only after a maintainer approves it with 2FA on npmjs.com.
      - run: npm stage publish --access public --provenance
        if: ${{ steps.release.outputs.release_created }}
