name: release

# Builds the package and force-pushes the result to the `release` branch, so
# `npm install -g github:SharonFabin/logs-axi#release` needs no build step.
# The build job runs npm with a read-only token; the publish job has the write
# token and runs only git on the downloaded build output.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build
      - name: Assemble release tree
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          cp -R dist skills config.example.json README.md "$RUNNER_TEMP/release/"
          # Drop scripts (prepare would rerun tsc on install) and devDependencies.
          node -e '
            const fs = require("fs");
            const p = JSON.parse(fs.readFileSync("package.json", "utf8"));
            delete p.scripts;
            delete p.devDependencies;
            fs.writeFileSync(process.argv[1], JSON.stringify(p, null, 2) + "\n");
          ' "$RUNNER_TEMP/release/package.json"
      - uses: actions/upload-artifact@v4
        with:
          name: release-tree
          path: ${{ runner.temp }}/release
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-tree
          path: release
      - name: Push release branch
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init -q -b release
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Build of ${GITHUB_SHA}"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" release
